<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>{{LEARNER}}'s Review Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one calm card per step. Concept: a clean study notebook — white paper, cobalt ink for actions, a lemon highlighter on the chunks you're learning. Hierarchy: 1) what you act on (ink, large) 2) the target chunk (highlighted) 3) support text (muted, small). */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F1F3F6; --ink:#15171C; --muted:#636976; --faint:#A7ACB6; --line:rgba(21,23,28,.10);
  --accent:#2E5BEA; --accent-soft:#EAF0FF; --accent-line:rgba(46,91,234,.35); --on-accent:#FFFFFF;
  --hl:#FFE45C; --me:#EAF0FF;
  --btn:#15171C; --on-btn:#FFFFFF;
  --got:#1F9D63; --miss:#EF6351;
  --bar:rgba(245,246,248,.86); --shadow:0 1px 2px rgba(21,23,28,.04),0 8px 28px rgba(21,23,28,.06);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --f-zh:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#1A1D23; --surface-2:#232731; --ink:#EEF0F4; --muted:#9BA1AD; --faint:#6E7480; --line:rgba(238,240,244,.10);
  --accent:#8AA6FF; --accent-soft:rgba(138,166,255,.14); --accent-line:rgba(138,166,255,.40); --on-accent:#111318;
  --hl:rgba(255,214,10,.30); --me:rgba(138,166,255,.16);
  --btn:#EEF0F4; --on-btn:#111318;
  --got:#4CC48A; --miss:#FF8A7A;
  --bar:rgba(17,19,24,.86); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1A1D23; --surface-2:#232731; --ink:#EEF0F4; --muted:#9BA1AD; --faint:#6E7480; --line:rgba(238,240,244,.10);
  --accent:#8AA6FF; --accent-soft:rgba(138,166,255,.14); --accent-line:rgba(138,166,255,.40); --on-accent:#111318;
  --hl:rgba(255,214,10,.30); --me:rgba(138,166,255,.16);
  --btn:#EEF0F4; --on-btn:#111318;
  --got:#4CC48A; --miss:#FF8A7A;
  --bar:rgba(17,19,24,.86); --shadow:none; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:2px;padding-inline:4px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font:700 26px/1.2 var(--f-zh);letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font:600 13px var(--f-zh);color:var(--muted);letter-spacing:.06em;margin:0}
h3{font:600 12px var(--f-zh);margin:0;color:var(--muted);letter-spacing:.06em}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.day{font:600 12px var(--f-ui);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.day{position:relative}
.day.full{color:var(--got);border-color:var(--got)}
.day.full::after{content:"★";position:absolute;top:-7px;right:-6px;width:15px;height:15px;border-radius:50%;background:var(--got);color:#fff;font-size:9px;line-height:15px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px;margin-inline:-4px;border-radius:14px;background:var(--bar);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px)}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:6px;font:500 14px var(--f-zh);padding:7px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.step .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font:600 11px var(--f-ui);font-variant-numeric:tabular-nums}
.step.done .n{background:var(--line);border-color:transparent;color:var(--ink)}
.step[aria-current="step"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.step[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.panel{background:var(--surface);border-radius:20px;padding:22px 20px 24px;display:flex;flex-direction:column;gap:20px;min-width:0;box-shadow:var(--shadow)}
.zh{font-family:var(--f-zh)}
.gauge{display:flex;align-items:center;gap:12px}
.ticks{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:4px}
.tick{height:4px;border-radius:2px;background:var(--line)}
.tick.got{background:var(--got)} .tick.miss{background:var(--miss)}
/* Apple page-control feel: every segment is the same thin capsule; the current one stretches wider and turns label-dark. No outline, no extra colour. */
.ticks{display:flex;gap:4px}
.tick{flex:1 1 0;min-width:0;height:4px;border-radius:999px;transition:flex-grow .45s cubic-bezier(.32,.72,0,1),background-color .3s}
.tick.cur{flex-grow:2;background:var(--faint)}
.tick.cur.got{background:var(--got)} .tick.cur.miss{background:var(--miss)} .tick.cur.fuzzy{background:#E7A93B}
.ticks{padding-block:5px;height:auto;align-items:center}
.count{font:600 13px var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{display:flex;flex-direction:column;gap:16px;min-height:220px}
.prompt{font-family:var(--f-zh);font-size:21px;line-height:1.5;font-weight:600}
.hint{font-size:14px;color:var(--muted)}
.answer{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:14px;padding:16px}
.chunk{font-size:21px;font-weight:700;color:var(--ink);line-height:1.3;align-self:flex-start}
.chunk,.hrow>.chunk{display:inline;background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.chunkBox{min-width:0;line-height:1.3}
.sent{font-size:19px;font-weight:600;line-height:1.5}
.sent .hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ex{color:var(--muted);font-size:15px}
.actions{display:flex;gap:8px;flex-wrap:nowrap;margin-top:auto}
.actions button{flex:1 1 0;min-width:0;padding:11px 4px;font-size:15px;white-space:nowrap}
.actions .primary{flex:1.3 1 0}
button{font:500 16px var(--f-ui);border-radius:12px;padding:11px 16px;cursor:pointer;border:1px solid transparent;transition:transform .12s,background .2s}
button:active{transform:scale(.98)}
button:focus-visible,.day:focus-visible,.step:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;flex:1}
.primary:hover{filter:brightness(1.06)}
.got-btn,.miss-btn{background:transparent;color:var(--ink);border-color:var(--line);flex:1}
.got-btn:hover,.miss-btn:hover,.ghost:hover{background:var(--surface-2)}
.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.small{padding:6px 12px;font-size:14px;border-radius:999px;align-self:flex-start;color:var(--ink);border-color:var(--line);background:transparent}
.status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;align-self:flex-start;border:1px solid var(--line);color:var(--muted)}
.status.got{color:var(--got)} .status.miss{color:var(--miss)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* learn step */
.story{display:flex;flex-direction:column;gap:4px}
.story .ep{font:700 24px/1.25 var(--f-ui);color:var(--ink);letter-spacing:-.01em;margin-bottom:4px}
.recap{font-size:16px;line-height:1.65}
.scene{font-family:var(--f-zh);font-size:14px;color:var(--muted);line-height:1.6;text-align:center;padding:4px 8px}
.scene+.dlg{margin-top:-14px}
.scene+.dlg>.narr.in:first-child{padding-top:0}
.chunks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.chunkItem{display:flex;flex-direction:column;gap:3px;padding:14px 0;border-bottom:1px solid var(--line)}
.chunkItem .chunk{font-size:19px}
.mean{font-size:15px}
.zhs{font-family:var(--f-zh);font-size:13px;color:var(--muted)}
.dlg{display:flex;flex-direction:column;gap:10px}
.bub{display:flex;flex-direction:column;gap:3px;max-width:86%;align-self:flex-start;min-width:0}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub.ctx .line,.bub.ctx.me .line{background:transparent;color:var(--muted);border:1px solid var(--line)}
.bub.ctx .line strong,.bub.ctx.me .line strong{color:var(--muted);background:none}
.who{font:600 12px var(--f-ui);color:var(--muted);padding-inline:4px}
.line{min-width:0;background:transparent;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:16px;line-height:1.5}
.bub.me .line{background:var(--me);border-color:transparent;color:var(--ink);border-radius:16px 16px 4px 16px}
.line strong{color:var(--ink);font-weight:700;background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.think{font-family:var(--f-zh);font-size:14px;color:var(--muted)}
.teaser{font-family:var(--f-zh);font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
/* practice: the conversation continues, your turn */
.turnNote{font-family:var(--f-zh);font-size:14px;color:var(--muted)}
.pr{display:flex;flex-direction:column;gap:8px}
.pr+.pr{border-top:1px solid var(--line);padding-top:18px}
.task{font-size:14px;color:var(--muted);padding-inline:4px}
.myturn{align-self:flex-end;width:88%;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.myturn textarea{border:1.5px dashed var(--faint);background:transparent;border-radius:16px 16px 4px 16px;min-height:92px}
.ref{align-self:flex-end;max-width:88%;background:var(--me);color:var(--ink);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:16px}
.ref b{color:var(--muted);font:600 12px var(--f-zh);display:block;margin-bottom:2px}
textarea{width:100%;box-sizing:border-box;min-height:88px;font:16px/1.5 var(--f-ui);color:var(--ink);background:var(--surface-2);border:0;border-radius:14px;padding:12px 14px;resize:vertical}
textarea::placeholder{color:var(--faint)}
textarea.big{min-height:150px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted)}
.vbrief{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:14px;padding:14px 16px;font-family:var(--f-zh)}.vwho{font-weight:700;font-size:16px}.vscene{font-size:15px;line-height:1.6}.vlab{font-size:13px;color:var(--muted);margin-top:4px}.vgoals{margin:0;padding-left:20px;font-size:15px;line-height:1.6}.vchips{display:flex;flex-wrap:wrap;gap:6px}.vchip{font:500 14px var(--f-ui);background:var(--surface);border-radius:999px;padding:4px 10px}.vnote{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px}.vhow{margin-top:14px;font-size:15px;color:var(--muted)}.vdet{margin-top:10px}.vdet summary{cursor:pointer;font:14px var(--f-zh);color:var(--muted);margin-bottom:8px}
pre.voice{margin:0;white-space:pre-wrap;word-break:break-word;font:14px/1.6 var(--f-mono);background:var(--surface-2);border-radius:14px;padding:16px;max-height:320px;overflow:auto}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp .mine{color:var(--muted);padding:2px 0;white-space:pre-line}
.cmp .better{background:var(--surface-2);border-radius:14px;padding:12px 14px;white-space:pre-line}
.news{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}

.news strong{font-size:16px;line-height:1.4}
.news a{color:var(--accent);text-decoration:none}
.news .why{font-size:15px;line-height:1.65;margin-top:8px;color:var(--ink)}
.nav{display:flex;gap:10px}
.nav .primary,.nav .ghost{border-radius:999px}
.nav .primary{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.empty{background:var(--surface);border-radius:20px;padding:28px 22px;color:var(--muted);box-shadow:var(--shadow)}
#gNote{text-align:center}
.play{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border-radius:50%;font-size:12px;flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid var(--line)}
.play.wide{width:auto;padding:6px 12px;border-radius:999px;font-size:14px;gap:6px;display:inline-flex;align-items:center}

.hrow>:first-child{min-width:0}

.sec{display:flex;flex-direction:column;gap:14px;min-width:0}

.bossBox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}

<div class="wrap">
  <header>
    <div class="eyerow"><span class="eyebrow" id="eyebrow">Daily English</span><button class="day bankBtn" id="bankBtn" type="button">表达库</button></div>
    <h1 id="title">今日学习</h1>
    <div class="days" id="days" role="group" aria-label="选择日期"></div>
  </header>

  <div id="empty" class="empty">正在加载今天的学习内容……每天早上 8 点简报发出后，这里会按顺序出现当天的复习和练习。</div>

  <nav class="steps" id="steps" aria-label="学习步骤" hidden></nav>
  <section class="panel" id="panel" hidden></section>
  <div class="nav" id="nav" hidden>
    <button class="ghost" id="prevBtn">上一步</button>
    <button class="primary" id="nextBtn">下一步</button>
  </div>
  <span class="note" id="gNote" role="status"></span>
  <section id="bankView" hidden></section>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  let db=null, days=[], curId=null, step=0, idx=0, revealed=false, shown={};
  const learnerName="{{LEARNER}}";
  const isLearner=who=>String(who||"").trim().toLowerCase()===learnerName.trim().toLowerCase();
  const el=(tag,cls,txt)=>{
    if(tag==="div"&&cls==="chunk"){ const w=document.createElement("div"); w.className="chunkBox"; const s=document.createElement("span"); s.className="chunk"; if(txt!=null) s.textContent=txt; w.appendChild(s); return w; }
    const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;};
  const btn=(txt,cls,fn)=>{const b=el("button",cls,txt); b.type="button"; b.onclick=fn; return b;};
  // "**bold**" markers → <strong>, built from text nodes only
  function rich(parent,s){String(s||"").split("**").forEach((part,i)=>{ if(!part) return; if(i%2){parent.appendChild(el("strong",null,part));} else parent.appendChild(document.createTextNode(part)); }); return parent;}

  // read-aloud with the browser's built-in voice (hidden where unsupported)
  const canSpeak=false; // read-aloud turned off at the learner's request
  // rank the device's English voices: neural/premium first, then US, then other English
  function voiceScore(v){let sc=0; const n=v.name||"";
    if(/natural|neural|premium|enhanced|online/i.test(n)) sc+=100;
    if(/Ava|Zoe|Evan|Nathan|Noelle|Samantha|Allison|Aria|Jenny|Emma|Andrew|Brian|Google US/i.test(n)) sc+=20;
    if(/^en[-_]US/i.test(v.lang)) sc+=10; else if(/^en[-_](GB|AU|CA|IE)/i.test(v.lang)) sc+=5;
    if(/compact|eloquence|novelty|bad news|bells|bubbles|cellos|jester|organ|trinoids|whisper|zarvox|albert|fred|junior|ralph|superstar|wobble|boing|bahh|good news|grandma|grandpa|rocko|shelley|sandy|reed|flo|eddy/i.test(n)) sc-=200;
    return sc;}
  function englishVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));}catch(e){return [];}}
  const voiceName=null;
  function chosenVoice(){const vs=englishVoices(); return vs.find(v=>v.name===voiceName)||vs[0]||null;}
  const rate=0.92;
  function utter(t){const u=new SpeechSynthesisUtterance(String(t).replace(/\*\*/g,"")); const v=chosenVoice(); if(v){u.voice=v; u.lang=v.lang;} else u.lang="en-US"; u.rate=rate; return u;}

  function speak(list){ if(!canSpeak) return; try{speechSynthesis.cancel(); [].concat(list).forEach(t=>{ if(t) speechSynthesis.speak(utter(t)); });}catch(e){} }
  function play(text,label){ const b=btn(label||"▶",label?"play wide":"play",()=>speak(text)); b.setAttribute("aria-label","朗读"); if(!canSpeak) b.hidden=true; return b; }
  function whyNode(o){ return o&&o.why? el("div","whyx","💡 为什么这么说："+o.why) : null; }
  function addWhy(box,o){ const w=whyNode(o); if(w) box.appendChild(w); if(o&&o.vs&&o.vs.length){ const v=el("div","whyx"); v.style.borderLeftColor="var(--faint)"; v.appendChild(el("div",null,"🔀 易混的表达")); o.vs.forEach(x=>{ const r=el("div"); r.appendChild(el("b",null,String(x.chunk||""))); r.appendChild(document.createTextNode("：" +String(x.when||""))); v.appendChild(r); }); box.appendChild(v); } }
  // Chinese stays folded: a small “中文” button reveals it, so she reads the English first
  function zhFold(box,key,text,cls){ if(!text) return; if(shown["zh-"+key]) box.appendChild(el("div",cls||"zhs",text)); else { const b=btn("中文","tipBtn",()=>{shown["zh-"+key]=true; render();}); b.style.alignSelf="flex-start"; b.style.padding="2px 8px"; b.style.fontSize="12px"; box.appendChild(b); } }
  function tipToggle(box,text,key){ if(!text) return; const t=el("div","tip",text); t.hidden=!(key&&shown["tipopen-"+key]); const b=btn(t.hidden?"提示":"收起提示","tipBtn",()=>{t.hidden=!t.hidden; b.textContent=t.hidden?"提示":"收起提示"; if(key) shown["tipopen-"+key]=!t.hidden;}); box.appendChild(b); box.appendChild(t); }
  function cur(){return days.find(d=>d.id===curId)}
  function stepsFor(d){
    const L=d.lesson||null, s=[{id:"review",name:"Review"}];
    if(L){
      const mineC=(L.chunks||[]).some(c=>/^✍/.test(c.chunk||"")), sceneC=(L.chunks||[]).some(c=>!/^✍/.test(c.chunk||""));
      if((L.fix&&((L.fix.items&&L.fix.items.length)||L.fix.better))||mineC) s.push({id:"fix",name:"Feedback"});
      if((L.dialogue&&L.dialogue.length)||(L.exchange&&L.exchange.length)||(L.practice&&L.practice.length)||sceneC) s.push({id:"story",name:"Story"});
    }
    if(L&&L.think&&((L.think.read&&L.think.read.sentence)||(L.think.build&&L.think.build.start)||(L.think.extra&&L.think.extra.prompt)||(L.think.picture&&L.think.picture.svg))) s.push({id:"think",name:"Drills"});
    if(L&&L.mission&&L.mission.task) s.push({id:"mission",name:"Mission"});
    if(d.task) s.push({id:"write",name:"Writing"});
    if(L&&L.listen&&L.listen.url) s.push({id:"listen",name:"Listening"});
    if(L&&L.voice) s.push({id:"voice",name:"Speaking"});
    return s;
  }
  function firstOpen(){
    const c=cur(); if(!c) return 0; const r=c.data.results||{};
    const i=(c.data.cards||[]).findIndex(k=>!r[k.key]); return i<0?(c.data.cards||[]).length:i;
  }
  function selectDay(id){ if(bankOpen) closeBank(true); curId=id; idx=firstOpen(); revealed=false; shown={}; const c=cur(); const st=stepsFor(c.data); const done=(c.data.done)||{}; const f=st.findIndex(x=>!done[x.id]); step=f<0?0:f; render();}

  function renderDays(){
    const box=$("days"); box.textContent="";
    const wk=s=>{const t=new Date(s+"T12:00:00"); t.setDate(t.getDate()-((t.getDay()+6)%7)); return t.getFullYear()+"-"+t.getMonth()+"-"+t.getDate();};
    const thisWk=days.length?wk(days[0].id):"";
    days.filter(d=>wk(d.id)===thisWk).reverse().forEach(d=>{
      const st=stepsFor(d.data||{}), dn=(d.data&&d.data.done)||{}, full=st.length>0&&st.every(s=>dn[s.id]);
      const b=el("button","day"+(full?" full":""),["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(d.id+"T12:00:00").getDay()]); b.title=d.id+(full?" · done":""); b.type="button"; b.setAttribute("aria-pressed",d.id===curId?"true":"false");
      b.onclick=()=>selectDay(d.id); box.appendChild(b);
    });
  }
  function render(){
    if(bankOpen) return;
    const c=cur();
    if(!c){ $("empty").hidden=false; ["steps","panel","nav"].forEach(i=>$(i).hidden=true); return; }
    $("empty").hidden=true; ["steps","panel","nav"].forEach(i=>$(i).hidden=false);
    renderDays();
    const d=c.data, st=stepsFor(d), done=d.done||{};
    if(step>=st.length) step=st.length-1;
    $("eyebrow").textContent=(d.label||c.id)+" · Daily English"; $("title").textContent=sceneEn(d.scene);
    const sb=$("steps"); sb.textContent="";
    st.forEach((s,i)=>{
      const b=el("button","step"+(done[s.id]?" done":"")); b.type="button";
      b.appendChild(el("span","n",String(i+1))); b.appendChild(el("span",null,s.name+(done[s.id]?" ✓":"")));
      if(i===step) b.setAttribute("aria-current","step");
      b.onclick=()=>{step=i; render(); scrollTop();}; sb.appendChild(b);
    });
    const p=$("panel"); p.textContent="";
    const s=st[step];
    ({review:renderReview,think:renderThink,listen:renderListen,story:renderStory,write:renderWrite,voice:renderVoice,mission:renderMission,talk:renderTalk,fix:renderFix,news:renderNews})[s.id](p,d,c);
    $("prevBtn").hidden=step===0;
    $("nextBtn").textContent=step===st.length-1?"完成今天的学习":"完成，下一步";
  }
  // header in English: the lesson data keeps its Chinese scene names, the page shows them in English
  function sceneEn(s){ s=String(s||"").trim(); if(!s) return "Today";
    const M={"作品集":"Portfolio","设计评审":"Design review","职场沟通":"Work chat","邮件和 Teams":"Email & Teams","面试":"Interview","讲经历":"Telling your story","会议":"Meetings","应对追问":"Handling follow-ups","社交":"Small talk","日常生活":"Daily life","工作":"Work","weekly quiz":"Weekly quiz"};
    return s.split(/\s*[·+]\s*/).map(x=>M[x]||x).join(" · "); }
  function scrollTop(){try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){}}

  // 1. review cards
  function renderReview(p,d){
    p.appendChild(el("h2",null,"复习卡片"));
    if(d.lesson&&d.lesson.paused&&d.lesson.pausedNote) p.appendChild(el("div","note zh",d.lesson.pausedNote));
    const cards=d.cards||[], r=d.results||{};
    if(!cards.length){p.appendChild(el("div","prompt","今天没有要复习的表达 ✅")); return;}
    const g=el("div","gauge"), t=el("div","ticks"); t.setAttribute("aria-hidden","true");
    cards.forEach((k,i)=>t.appendChild(el("span","tick"+(r[k.key]==="got"?" got":r[k.key]==="miss"?" miss":r[k.key]==="fuzzy"?" fuzzy":(i===idx?" now":""))+(i===idx&&idx<cards.length?" cur":""))));
    g.appendChild(t); g.appendChild(el("span","count",cards.filter(k=>r[k.key]).length+" / "+cards.length)); p.appendChild(g);
    const card=el("div","card"); p.appendChild(card);
    if(idx>=cards.length){
      const got=cards.filter(k=>r[k.key]==="got"), miss=cards.filter(k=>r[k.key]==="miss"), fz=cards.filter(k=>r[k.key]==="fuzzy");
      const isOther=k=>(((d.typed||{})[k.key]||{}).fz==="other"), fzO=fz.filter(isOther), fzC=fz.filter(k=>!isOther(k));
      card.appendChild(el("div","prompt","复习完了：记得 "+got.length+" 个，差一点 "+fzC.length+" 个，换了说法 "+fzO.length+" 个，忘了 "+miss.length+" 个。"));
      const lst=miss.concat(fz);
      if(lst.length){card.appendChild(el("div","hint","忘了的降一级，差一点和换了说法的不升级，明天都会再考一次：")); const ul=el("ul","plain"); lst.forEach(k=>ul.appendChild(el("li",null,k.chunk))); card.appendChild(ul);}
      const a=el("div","actions"); a.appendChild(btn("上一张","ghost wide",()=>{idx=cards.length-1; revealed=false; render();})); a.appendChild(btn("从头再过一遍","ghost wide",()=>{idx=0; revealed=false; render();})); card.appendChild(a);
      return;
    }
    const k=cards[idx];
    if(r[k.key]&&!revealed){ renderDone(card,k,cards,r,d); return; }
    renderPrompt(card,k,cards,r);
    if(!revealed){ if((Number(k.level)===2||k.kind==="usage")&&k.hint) card.appendChild(el("div","tip",k.hint)); else tipToggle(card,k.hint,k.key); }
    else if(k.hint&&((Number(k.level)===2||k.kind==="usage")||shown["tipopen-"+k.key])) card.appendChild(el("div","tip",k.hint));
    if(r[k.key]) card.appendChild(el("span","status "+r[k.key],({got:"记得",fuzzy:(((d.typed||{})[k.key]||{}).fz==="other"?"换了个说法":"差一点"),miss:"忘了"})[r[k.key]]||""));
    const a=el("div","actions");
    const typed=(k.stage==="cue"||k.stage==="gap"), chk=shown["chk-"+k.key];
    if(k.stage==="choice"){
      if(!revealed){
        card.appendChild(el("div","hint","选出这个场合里意思对的那一个。"));
        const o=el("div","qaOpts"); (k.options||[]).forEach(op=>o.appendChild(btn(op,"qaOpt",()=>{ const g=op===k.form?"got":"miss"; shown["chk-"+k.key]={typed:op,grade:g}; saveResult(k.key,g,{text:op}); revealed=true; render(); }))); card.appendChild(o);
        if(idx>0) a.appendChild(btn("上一张","ghost",()=>{idx--; revealed=false; render();}));
      } else {
        const c2=shown["chk-"+k.key]||{}; const res=el("div","result "+c2.grade); res.appendChild(el("b",null,c2.grade==="got"?"✓ 选对了":"这里应该用 "+k.form)); if(c2.typed) res.appendChild(el("div","said","你选的："+c2.typed)); card.appendChild(res);
        const ans=el("div","answer"); ans.appendChild(el("span","fixLbl","参考说法")); ans.appendChild(answerNode(k)); card.appendChild(ans); usageTable(card,k);
        a.appendChild(btn("下一张","primary",()=>{ delete shown["chk-"+k.key]; mark(k.key,c2.grade,{text:c2.typed||""}); }));
      }
      card.appendChild(a); return;

      row.appendChild(btn("想不出来","qlink",()=>go("")));
      row.appendChild(btn("对照参考","qgo",()=>{ const t=ta.value.trim(); if(!t){ ta.focus(); return; } go(t); }));
      box.appendChild(row); return false;
    }
    if(v){ const m=el("div","said"); m.appendChild(el("b",null,"你写的")); m.appendChild(el("span",null,v)); box.appendChild(m); }
    if(isRead&&v&&sameT(v,ref)) box.appendChild(el("div","qmsg got","✓ 找对了"));
    else { const hadFb=(v&&!isRead)?renderFb(box,fbOf(key),v):false; const r=el("div","fixRow better"); r.appendChild(el("span","fixLbl",isRead?"车头（主干）":"参考说法")); r.appendChild(el("div","fixTxt",ref||"")); box.appendChild(r); if(v&&!isRead&&!hadFb) addSmallFix(box,v,ref); }
    if(note) box.appendChild(el("div","fixNote zh",note));
    return true;
  }
  // 搭积木: she types only the piece she adds; the reference shows the whole sentence with that piece highlighted
  function buildStep(box,key,base,st){
    const cd=cur(), A=(cd&&cd.data.thinkAns)||{}, v=(shown["th-"+key]!=null)?shown["th-"+key]:A[key];
    const b0=String(base||"").replace(/[.!?]\s*$/,""), ref=String(st.ref||""), add=ref.indexOf(b0)===0?ref.slice(b0.length).trim():ref;
    const aiTask="Continue this sentence by adding ONE piece that starts with the connector \""+(st.hook||"")+"\": \""+base+"\" (idea keywords: "+(st.hint||"")+"). She typed only the piece she adds, which goes right after the sentence.", aiRef=add;
    if(v==null){
      const ta=el("textarea","say"); ta.placeholder="只打要加的这一节，比如："+(st.hook||"……"); ta.value=shown["thd-"+key]||""; ta.oninput=()=>{shown["thd-"+key]=ta.value;}; ta.setAttribute("aria-label","你要加的部分"); box.appendChild(ta);
      const row=el("div","qact");
      const go=(val)=>{ shown["th-"+key]=val; if(cd){ cd.data.thinkAns=Object.assign({},cd.data.thinkAns,{[key]:val}); } saveField({thinkAns:{[key]:val}}); render(); if(val&&aiTask) aiThink(key,aiTask,val,aiRef); };
      row.appendChild(btn("想不出来","qlink",()=>go("")));
      row.appendChild(btn("对照参考","qgo",()=>{ const t=ta.value.trim(); if(!t){ ta.focus(); return; } go(t); }));
      box.appendChild(row); return false;
    }
    if(v){ const m=el("div","said"); m.appendChild(el("b",null,"你加的")); m.appendChild(el("span",null,v)); box.appendChild(m); }
    const hadFb=v?renderFb(box,fbOf(key),v):false;
    const r=el("div","fixRow better"); r.appendChild(el("span","fixLbl","参考"));
    const t=el("div","fixTxt"); if(add!==ref){ t.appendChild(document.createTextNode(b0+" ")); t.appendChild(el("span","useTag",add)); } else t.textContent=ref; r.appendChild(t); box.appendChild(r);
    if(v&&!hadFb) addSmallFix(box,v,add);
    if(st.note) box.appendChild(el("div","fixNote zh",st.note));
    return true;
  }
  function renderThink(p,d){
    const T=d.lesson.think||{}; p.appendChild(el("h2",null,"小练习"));
    if(T.focus) p.appendChild(el("div","ltitle zh",T.focus));
    if(T.tip) p.appendChild(el("div","tip",T.tip));
    let n=0;
    if(T.read&&T.read.sentence){
      const s=sec(p,++n,"找车头","先找出“谁 + 做了什么”，其他都是车厢");
      const c=el("div","qcard"); c.appendChild(el("div","qsent",T.read.sentence)); s.appendChild(c);
      thinkInput(c,"read","把主干打出来……",T.read.core,T.read.note,true);
    }
    const B=T.build;
    if(B&&B.start&&B.steps&&B.steps.length){
      const s=sec(p,++n,"搭积木","一次只挂一节车厢");
      s.appendChild(el("div","turnNote","用提示的挂钩词往后加一节，只打要加的部分。先把整句小声说一遍，再打。"));
      let curS=B.start;
      for(let i=0;i<B.steps.length;i++){
        const st=B.steps[i], c=el("div","qcard");
        c.appendChild(el("div","qctx","第 "+(i+1)+" 节 · 现在的句子"));
        c.appendChild(el("div","qsent",curS));
        const h=el("div","zh"); h.appendChild(document.createTextNode("挂钩词：")); h.appendChild(el("span","useTag",st.hook||"")); if(st.hint) h.appendChild(document.createTextNode("　线索："+st.hint)); c.appendChild(h);
        s.appendChild(c);
        const done=buildStep(c,"b"+(i+1),curS,st);
        if(!done) break;
        curS=st.ref;
      }
    }
    [["facts","给事实说句子","只给关键词，自己组织：先说结论，原因放后面，重点放最后"],["quick","快问快答","像在会上被问到一样，直接用英文答，不要先想中文"]].forEach(function(q){
      const F=T[q[0]]; if(!(F&&F.prompt)) return;
      const s=sec(p,++n,q[1],q[2]), c=el("div","qcard");
      c.appendChild(el("div","qsent",F.prompt));
      if(F.keys&&F.keys.length){ const kk=el("div","zh"); kk.appendChild(document.createTextNode("关键词：")); kk.appendChild(el("span","useTag",F.keys.join(" · "))); c.appendChild(kk); }
      if(F.hint){ const tp=el("div","tip",F.hint); tp.hidden=!shown["thf-"+q[0]]; if(tp.hidden) c.appendChild(btn("卡住了？看线索","tipBtn",()=>{shown["thf-"+q[0]]=true; render();})); c.appendChild(tp); }
      s.appendChild(c);
      thinkInput(c,q[0],"用 1–2 句英文说……",F.ref,F.note,false,F.prompt+(F.keys&&F.keys.length?"\n\nKeywords she was given: "+F.keys.join(", "):"")+"\n\nHere is a sample answer: \""+F.ref+"\". Her answer can use different wording and still be right if it does the task and puts the main point first and the key information last.");
    });
    const X=T.extra;
    if(X&&X.prompt){
      const around=X.kind==="around";
      const s=sec(p,++n,around?"绕着说":"看到什么说什么",around?"想不起那个词？用简单英文把它描述出来":"不经过中文，直接用英文描述眼前的东西");
      const c=el("div","qcard"); if(around&&X.thing){ const th=el("div","zh"); th.appendChild(document.createTextNode("想不起来的英文：")); th.appendChild(el("span","useTag",X.thing)); c.appendChild(th); } c.appendChild(el("div","qsent",X.prompt));
      if(X.hint){ const tp=el("div","tip",X.hint); tp.hidden=!shown["thx-tip"]; if(tp.hidden) c.appendChild(btn("卡住了？看线索","tipBtn",()=>{shown["thx-tip"]=true; render();})); c.appendChild(tp); }
      s.appendChild(c);
      const xDone=thinkInput(c,"x",around?"不用那个词，把意思说出来……":"用 2–3 句英文描述……",X.ref,"",false,around&&X.word?X.prompt+"\n\nThis is a 'say it without the word' exercise. The word or expression she can't remember: "+(X.thing||"")+" (in English: "+X.word+"; it may be a noun, verb, adjective or phrase). She must get the meaning across WITHOUT saying \""+X.word+"\" (or the same word in another form). Check whether a listener would understand what she means. If she used the word itself, the verdict is at most \"fuzzy\" and the note tells her to describe it instead.":X.prompt);
      if(xDone&&X.word){ const w=el("div","answer"); w.appendChild(el("span","fixLbl","那个词")); w.appendChild(el("div","chunk",X.word)); c.appendChild(w); }
      if(xDone&&X.note) c.appendChild(el("div","fixNote zh",X.note));
    }
    const Pc=T.picture;
    if(Pc&&Pc.svg&&Pc.prompt){
      const s=sec(p,++n,"看图说","先看图，直接用英文说，不经过中文");
      const c=el("div","qcard"), im=el("img"); im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(Pc.svg); im.alt="练习图片"; im.style.width="100%"; im.style.height="auto"; im.style.borderRadius="12px"; c.appendChild(im);
      c.appendChild(el("div","qsent",Pc.prompt));
      if(Pc.hint){ const tp=el("div","tip",Pc.hint); tp.hidden=!shown["thp-tip"]; if(tp.hidden) c.appendChild(btn("卡住了？看线索","tipBtn",()=>{shown["thp-tip"]=true; render();})); c.appendChild(tp); }
      s.appendChild(c);
      thinkInput(c,"pic","用 2–3 句英文描述这张图……",Pc.ref,Pc.note,false,"Look at a picture and describe it. "+Pc.prompt+"\n\nYou can't see the picture. Here is an accurate sample answer for it: \""+Pc.ref+"\". Use it to know what the picture shows. Her answer can take a different angle or wording and still be right if it does the task and fits the picture; only point out details that clearly contradict the sample (a wrong object, place or action).");
    }
  }
  // 7. news
  function renderNews(p,d){
    p.appendChild(el("h2",null,"简讯"));
    const ul=el("ul","news");
    d.lesson.news.forEach(n=>{const li=el("li"); li.appendChild(el("strong",null,n.headline)); const meta=el("span","note"); meta.appendChild(document.createTextNode((n.zh||"")+" · ")); if(n.url&&/^https:\/\//.test(n.url)){const a=el("a",null,n.source||"来源"); a.href=n.url; a.target="_blank"; a.rel="noopener"; meta.appendChild(a);} li.appendChild(meta); if(n.why) li.appendChild(el("div","why zh",n.why)); ul.appendChild(li);});
    p.appendChild(ul);
  }

  async function saveField(obj,okMsg){
    const c=cur(); if(!c||!db) return false;
    try{ await db.doc("days/"+c.id).update(obj); if(okMsg) $("gNote").textContent=okMsg; return true; }
    catch(e){ $("gNote").textContent="没能保存，请检查网络后再试。"; return false; }
  }
  // save a card's result + what she typed as soon as it is checked, so going back never loses it
  function saveResult(key,val,extra){ const upd={results:{[key]:val}}; if(extra) upd.typed={[key]:extra}; return saveField(upd); }
  async function mark(key,val,extra){
    const c=cur(); if(!c||!db) return;
    idx++; revealed=false;
    const upd={results:{[key]:val}}; if(extra) upd.typed={[key]:extra};
    const ok=await saveField(upd);
    if(!ok){ idx--; $("gNote").textContent="没能保存这张卡的结果，请检查网络后再点一次。"; }
    render();
  }
  $("prevBtn").onclick=()=>{ if(step>0){step--; render(); scrollTop();} };
  $("nextBtn").onclick=async()=>{
    const c=cur(); if(!c) return; const st=stepsFor(c.data), s=st[step];
    if(s.id==="write"){ const ta=document.getElementById("writing-"+c.id); if(ta && ta.value.trim()!==(c.data.writing||"")) await saveField({writing:ta.value.trim()}); }
    const last=step>=st.length-1;
    await saveField({done:last?{[s.id]:true,all:true}:{[s.id]:true}});
    if(!last){ step++; render(); scrollTop(); }
    else { render(); $("gNote").textContent="今天的学习全部完成 🎉 明天见！"; }
  };

  // ---- 表达库 view: reads bank/phrases and bank/usage from the same database ----
  let bank=null, usage=null, bankOpen=false, bankTab="due", bankQ="";
  const shDate=()=>new Date(Date.now()+8*36e5).toISOString().slice(0,10);
  const dayDiff=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
  function dueText(due,t){ if(!due) return ""; if(due==="已掌握") return "已掌握"; const n=dayDiff(due,t); if(n<0) return "已过期 "+(-n)+" 天"; if(n===0) return "今天到期"; return due.slice(5)+" · "+n+" 天后"; }
  function bankItem(r,t,mastered){
    const box=el("div","bk"); box.appendChild(el("div","bkc",r.chunk));
    if(r.zh) box.appendChild(el("div","bkz",r.zh));
    if(r.ex) box.appendChild(el("div","bke",r.ex));
    const m=el("div","bkm");
    if(mastered) m.textContent="掌握于 "+r.mastered;
    else { m.textContent="复习 "+r.level+" 次 · "+dueText(r.due,t)+(r.scene?" · "+r.scene:""); if(r.due<=t) box.classList.add("bkdue"); }
    box.appendChild(m); return box;
  }
  function usageItem(r,t){
    const box=el("div","bk"); box.appendChild(el("div","bkc",r.group));
    const T={rule:"语法规则",register:"语气差别",choice:"选词"};
    if(r.rule) box.appendChild(el("div","bkz",(T[r.type]?T[r.type]+"：":"")+r.rule));
    if(r.myCase) box.appendChild(el("div","bkz","你的场合："+r.myCase));
    if(r.ex) box.appendChild(el("div","bke",r.ex));
    box.appendChild(el("div","bkm","阶段 "+r.stage+" · "+dueText(r.due,t)));
    if(r.due!=="已掌握"&&r.due<=t) box.classList.add("bkdue");
    return box;
  }
  function renderBank(){
    const v=$("bankView"); v.textContent="";
    if(!bank&&!usage){ v.appendChild(el("div","note","正在读取表达库……")); return; }
    const t=shDate(), rows=(bank&&bank.rows)||[], mast=(bank&&bank.mastered)||[], urows=(usage&&usage.rows)||[];
    const byDue=(a,b)=>a.due<b.due?-1:a.due>b.due?1:0;
    const dueRows=rows.filter(r=>r.due<=t).sort(byDue);
    const tabs=[["due","今天到期 "+dueRows.length],["all","全部 "+rows.length],["mast","已掌握 "+mast.length],["use","答疑本 "+urows.length]];
    const bar=el("div","bkt");
    tabs.forEach(x=>{ const b=btn(x[1],"day",()=>{ bankTab=x[0]; renderBank(); }); b.setAttribute("aria-pressed",String(bankTab===x[0])); bar.appendChild(b); });
    v.appendChild(bar);
    const q=document.createElement("input"); q.type="search"; q.className="bkq"; q.placeholder="搜索表达、中文或例句"; q.value=bankQ; v.appendChild(q);
    const list=el("div","bkl"); v.appendChild(list);
    function renderList(){
      list.textContent=""; const s=bankQ.trim().toLowerCase();
      const hit=r=>!s||[r.chunk,r.group,r.zh,r.ex,r.rule].some(x=>String(x||"").toLowerCase().indexOf(s)>=0);
      let items;
      if(bankTab==="due") items=dueRows.filter(hit).map(r=>bankItem(r,t,false));
      else if(bankTab==="all") items=rows.slice().sort(byDue).filter(hit).map(r=>bankItem(r,t,false));
      else if(bankTab==="mast") items=mast.filter(hit).map(r=>bankItem(r,t,true));
      else items=urows.filter(hit).map(r=>usageItem(r,t));
      if(!items.length) list.appendChild(el("div","note","没有内容"));
      items.forEach(i=>list.appendChild(i));
    }
    q.oninput=()=>{ bankQ=q.value; renderList(); };
    renderList();
  }
  function bankRefresh(){ if(!bankOpen) return; const a=document.activeElement; if(a&&a.className==="bkq") return; renderBank(); }
  function closeBank(skipRender){
    bankOpen=false; $("bankView").hidden=true; $("bankBtn").textContent="表达库";
    if(!skipRender) render();
  }
  function openBank(){
    bankOpen=true; ["empty","steps","panel","nav"].forEach(i=>$(i).hidden=true);
    $("bankView").hidden=false; $("bankBtn").textContent="返回今天"; renderBank(); scrollTop();
  }
  $("bankBtn").onclick=()=>{ if(bankOpen) closeBank(); else openBank(); };
  function startBank(){
    try{
      db.doc("bank/phrases").onSnapshot(s=>{ bank=s.exists?s.data():null; bankRefresh(); },()=>{});
      db.doc("bank/usage").onSnapshot(s=>{ usage=s.exists?s.data():null; bankRefresh(); },()=>{});
    }catch(e){}
  }

  claude.use("db").then(d=>{
    db=d;
    if(db) startBank();

    if(!db){ $("empty").textContent="需要登录 claude.ai 才能看到今天的学习内容。"; return; }
    db.collection("days").orderBy("date","desc").limit(7).onSnapshot(snap=>{
      const first=curId===null;
      days=snap.docs.map(x=>({id:x.id,data:x.data()||{}}));
      if(!days.length){ $("empty").textContent="还没有内容。每天早上 8 点简报发出后，这里会按顺序出现当天的复习和练习。"; render(); return; }
      if(first){ selectDay(days[0].id); return; }
      const a=document.activeElement; if(a && a.tagName==="TEXTAREA") return; // don't wipe typing
      render();
    },()=>{ $("empty").textContent="暂时连不上学习数据，请刷新页面。"; });
  });
})();
</script>

</body></html>
